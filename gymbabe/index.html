document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nter-events:auto;cursor:pointer;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 10px;background:linear-gradient(90deg,#FFB8DA,#D9C6FF 55%,#A9DDFF);border-bottom:3px solid #6F86E8;\">\n      <div style=\"display:flex;align-items:center;gap:6px;min-width:0;\"><span style=\"display:inline-block;width:16px;height:16px;flex:none;;line-height:0;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"display:block;overflow:visible;filter:drop-shadow(0 1px 1.5px rgba(124,104,240,.35));\"><defs><linearGradient id=\"gs20a\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFFFFF\"><\u002Fstop><stop offset=\".22\" stop-color=\"#F7D3F1\"><\u002Fstop><stop offset=\".42\" stop-color=\"#C3B2FF\"><\u002Fstop><stop offset=\".58\" stop-color=\"#A7E4F8\"><\u002Fstop><stop offset=\".76\" stop-color=\"#FFD9EE\"><\u002Fstop><stop offset=\"1\" stop-color=\"#FFFFFF\"><\u002Fstop><\u002FlinearGradient><linearGradient id=\"gs20b\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#A897FF\"><\u002Fstop><stop offset=\".3\" stop-color=\"#FFFFFF\"><\u002Fstop><stop offset=\".55\" stop-color=\"#9FE3F7\"><\u002Fstop><stop offset=\".8\" stop-color=\"#FFC6E6\"><\u002Fstop><stop offset=\"1\" stop-color=\"#A897FF\"><\u002Fstop><\u002FlinearGradient><radialGradient id=\"gs20c\" cx=\".38\" cy=\".34\" r=\".3\"><stop offset=\"0\" stop-color=\"#FFFFFF\" stop-opacity=\".95\"><\u002Fstop><stop offset=\"1\" stop-color=\"#FFFFFF\" stop-opacity=\"0\"><\u002Fstop><\u002FradialGradient><\u002Fdefs><g><path d=\"M12 .8C12.8 8.6 15.4 11.2 23.2 12C15.4 12.8 12.8 15.4 12 23.2C11.2 15.4 8.6 12.8 .8 12C8.6 11.2 11.2 8.6 12 .8Z\" fill=\"url(#gs20a)\" stroke=\"#7C68F0\" stroke-width=\".55\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M12 .8C12.8 8.6 15.4 11.2 23.2 12C15.4 12.8 12.8 15.4 12 23.2C11.2 15.4 8.6 12.8 .8 12C8.6 11.2 11.2 8.6 12 .8Z\" fill=\"url(#gs20c)\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fspan><span style=\"font:700 13px 'Space Grotesk',sans-serif;color:#2A1A47;\">GymBabe<\u002Fspan><\u002Fdiv>\n      <span aria-hidden=\"true\" style=\"width:18px;height:18px;flex:none;border-radius:6px;border:2px solid #6F86E8;background:#FF9ACB;box-shadow:inset 0 2px 0 rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;color:#2A1A47;\"><svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"display:block;\"><path d=\"M6.5 6.5l11 11M17.5 6.5l-11 11\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:12px 14px 14px;font:600 15px/1.35 'Space Grotesk',sans-serif;color:#2A1A47;text-wrap:pretty;\">{{ toastMsg }}<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;restAutoStart&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Treino&quot;},&quot;loadStep&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1&quot;,&quot;2.5&quot;,&quot;5&quot;],&quot;default&quot;:&quot;2.5&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Treino&quot;},&quot;decorIntensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:10,&quot;step&quot;:1,&quot;default&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Estilo&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    db: null, screen: 'splash', tab: 'home', prevScreen: 'app',\n    wid: null, exIdx: 0, session: null, paused: false, pausedAt: 0,\n    rest: null, restOpen: false,\n    sw: { running: false, acc: 0 },\n    toolTab: 'timer',\n    qr: { base: 60, total: 60, left: 60, phase: 'idle', endAt: 0 }, qrCustomOpen: false, qrCustom: '',\n    toast: null, tick: 0,\n    importMode: 'image', importText: '', importStatus: 'idle', importError: '', img: null, imgName: '',\n    draft: null, exName: null, done: null, prs: [], demoOpen: false, ask: null, undo: null, winC: {}, nudge: false, prFx: null,\n    cf: { min: '30', sec: '00', dist: '5.00', incl: '3' },\n    nf: { name: '', groups: '' }, nEx: [{ id: 'a1', name: '', sets: '3', reps: '12', load: '' }]\n  };\n\n  KEY = 'gymdiary.v1';\n\n  // Corridas do print da esteira, importadas em 26/10/2026: [dia, km, tempo]. Sem inclinação/kcal no print.\n  // Nunca podem se perder: ensureRuns() roda em todo load e em todo save() e só ACRESCENTA o que falta,\n  // comparando data local + distância (2 casas) + duração em segundos com o que já está no aparelho.\n  IMPORTED_RUNS = [\n    ['2026-09-08', 3.50, '30:07'], ['2026-09-11', 3.02, '25:39'], ['2026-09-23', 3.01, '27:01'],\n    ['2026-09-26', 3.06, '27:05'], ['2026-09-29', 3.52, '30:00'], ['2026-09-30', 3.61, '30:01'],\n    ['2026-10-02', 3.00, '24:24'], ['2026-10-05', 3.07, '25:00'], ['2026-10-08', 1.85, '16:10'],\n    ['2026-10-10', 3.00, '24:04'], ['2026-10-13', 3.00, '24:08'], ['2026-10-19', 3.07, '26:23'],\n    ['2026-10-28', 1.33, '11:00'] // registrada a pedido em 28/10/2026\n  ];\n  runKey(c) {\n    const d = new Date(c && c.date);\n    if (isNaN(d.getTime())) return '';\n    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')\n      + '|' + (Number(c.distance) || 0).toFixed(2) + '|' + Math.round(Number(c.duration) || 0);\n  }\n  importedRuns() {\n    return this.IMPORTED_RUNS.map(([day, km, t]) => {\n      const [y, m, d] = day.split('-').map(Number);\n      const [mm, ss] = t.split(':').map(Number);\n      return { id: 'imp-' + day, date: new Date(y, m - 1, d, 12, 0, 0).toISOString(), duration: mm * 60 + ss, distance: km, incline: null, kcal: null };\n    });\n  }\n  // Treinos registrados a pedido dela fora do app. Entram uma única vez (marca em db.seeded):\n  // se já houver sessão da mesma ficha no mesmo dia, não duplica; se ela apagar, não volta.\n  SEED_SESSIONS = [\n    { key: '2026-10-28|gym-t1-a', day: '2026-10-28', workoutId: 'gym-t1-a', duration: 48 * 60 }\n  ];\n  ensureSeeds(db) {\n    if (!db) return db;\n    const done = Array.isArray(db.seeded) ? db.seeded : [];\n    const todo = this.SEED_SESSIONS.filter(s => !done.includes(s.key));\n    if (!todo.length) return db;\n    const sessions = Array.isArray(db.sessions) ? [...db.sessions] : [];\n    const dayOf = (iso) => { const d = new Date(iso); return isNaN(d.getTime()) ? '' : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };\n    todo.forEach(s => {\n      const w = this.GYM.find(g => g.id === s.workoutId) || (db.workouts || []).find(g => g.id === s.workoutId);\n      if (!w || sessions.some(x => x && x.workoutId === s.workoutId && dayOf(x.date) === s.day)) return;\n      const [y, m, d] = s.day.split('-').map(Number);\n      sessions.push({\n        id: 'seed-' + s.key, workoutId: w.id, name: w.name, date: new Date(y, m - 1, d, 12, 0, 0).toISOString(), duration: s.duration,\n        ex: w.exercises.map(e => ({ name: e.name, rest: e.rest || 60, target: { sets: e.sets, reps: e.reps }, note: '',\n          sets: Array.from({ length: e.sets }, () => ({ load: Number(e.load) || 0, reps: Number(e.reps) || 0, done: true })) }))\n      });\n    });\n    sessions.sort((a, b) => new Date(a.date) - new Date(b.date));\n    return { ...db, sessions, seeded: [...done, ...todo.map(s => s.key)] };\n  }\n  ensureRuns(db) {\n    if (!db) return db;\n    const cardio = Array.isArray(db.cardio) ? db.cardio : [];\n    const keys = new Set(cardio.map(c => this.runKey(c)));\n    const ids = new Set(cardio.map(c => c && c.id));\n    const missing = this.importedRuns().filter(r => !ids.has(r.id) && !keys.has(this.runKey(r)));\n    if (!missing.length) return db;\n    return { ...db, cardio: [...cardio, ...missing] };\n  }\n\n  componentDidMount() {\n    try { const wc = JSON.parse(localStorage.getItem(this.WIN_KEY) || '{}'); if (wc && typeof wc === 'object' && !Array.isArray(wc)) this.setState({ winC: wc }); } catch (e) {}\n    let raw = null;\n    try { raw = localStorage.getItem(this.KEY); } catch (e) { raw = null; }\n    let db = null;\n    try { db = JSON.parse(raw || 'null'); } catch (e) { db = null; }\n    const valid = !!(db && db.v);\n    if (!valid) db = { v: 1, onboarded: false, profile: { name: 'Carol', goal: 'Glúteos e pernas', unit: 'kg', freq: 3, weight: 62 }, workouts: [], sessions: [], cardio: [] };\n    const withRuns = this.ensureSeeds(this.ensureRuns(db));\n    // grava no load só se o que havia no aparelho era legível (ou não havia nada): nunca sobrescreve dado ilegível\n    if (withRuns !== db && (valid || !raw)) { try { localStorage.setItem(this.KEY, JSON.stringify(withRuns)); } catch (e) {} }\n    db = withRuns;\n    this.setState({ db });\n    this._t0 = Date.now();\n    setTimeout(() => this.setState({ screen: db.onboarded ? 'app' : 'welcome' }), 1500);\n    this._last = Date.now();\n    this._iv = setInterval(() => this.loop(), 200);\n    let qb = 60; try { qb = Number(localStorage.getItem(this.QR_KEY)) || 60; } catch (e) {}\n    qb = Math.max(5, Math.min(3600, qb));\n    this.setState({ qr: { base: qb, total: qb, left: qb, phase: 'idle', endAt: 0 } });\n    this._vis = () => { if (document.visibilityState === 'visible' && this.state.screen === 'tools') this.wakeOn(); };\n    document.addEventListener('visibilitychange', this._vis);\n    this.setupHistory();\n  }\n  componentDidUpdate(pp, ps) { if (ps && ps.screen === 'tools' && this.state.screen !== 'tools') this.wakeOff(); this.syncHistory(); }\n\n  // Botão \"voltar\" do celular. Cada nível aberto (aba fora da Início, tela interna, folha ou janela)\n  // vira uma entrada no histórico do navegador, criada logo depois de um toque. Voltar desfaz um nível\n  // por vez; na Início sem nada aberto, o voltar fecha o app normalmente.\n  // Dentro da prévia do editor, uma pilha simulada substitui o histórico real (evento \"gymbabe:back\").\n  setupHistory() {\n    let top = false; try { top = window.top === window.self; } catch (e) { top = false; }\n    this._hd = 0; this._expect = null;\n    if (top && window.history && typeof history.pushState === 'function') {\n      this._H = { push: (d) => { try { history.pushState({ gb: d }, ''); } catch (e) {} }, go: (n) => { try { history.go(n); } catch (e) {} } };\n      this._pop = (e) => this.onPop(e);\n      window.addEventListener('popstate', this._pop);\n      const st0 = history.state;\n      if (st0 && typeof st0.gb === 'number' && st0.gb > 0) { this._hd = st0.gb; this.expectAt(0); this._H.go(-st0.gb); }\n    } else {\n      const stack = [0]; let i = 0;\n      const land = () => { const d = stack[i]; setTimeout(() => this.onPop({ state: { gb: d } }), 0); };\n      this._H = {\n        push: (d) => { stack.length = i + 1; stack.push(d); i = stack.length - 1; },\n        go: (n) => { const j = Math.max(0, Math.min(stack.length - 1, i + n)); if (j !== i) { i = j; land(); } },\n        back: () => { if (i > 0) { i--; land(); } }\n      };\n      this._fb = () => this._H.back();\n      window.addEventListener('gymbabe:back', this._fb);\n    }\n  }\n  expectAt(d) {\n    this._expect = d;\n    if (this._et) clearTimeout(this._et);\n    this._et = setTimeout(() => { if (this._expect === d) { this._expect = null; this.syncHistory(); } }, 1000);\n  }\n  navLevel(st) {\n    if (!st || !st.db) return 0;\n    let L = 0;\n    if (st.ask) L++;\n    if (st.rotationOpen) L++;\n    if (st.demoOpen) L++;\n    if (st.restOpen && st.screen === 'session') L++;\n    if (st.qrCustomOpen && st.screen === 'tools') L++;\n    const s = st.screen, offHome = st.tab && st.tab !== 'home' ? 1 : 0;\n    if (s === 'splash' || s === 'welcome') return L;\n    if (s === 'app') return L + offHome;\n    i  : 'app' });\n  }\n  componentWillUnmount() { if (this._pop) window.removeEventListener('popstate', this._pop); if (this._fb) window.removeEventListener('gymbabe:back', this._fb); if (this._et) clearTimeout(this._et); if (this._nt) clearTimeout(this._nt); if (this._pt) clearTimeout(this._pt); clearInterval(this._iv); if (this._tt) clearTimeout(this._tt); if (this._vis) document.removeEventListener('visibilitychange', this._vis); this.wakeOff(); }\n\n  loop() {\n    const now = Date.now(); const dt = (now - this._last) / 1000; this._last = now;\n    const p = {}; let any = false;\n    const s = this.state;\n    if (s.sw.running) { p.sw = { running: true, acc: s.sw.acc + dt }; any = true; }\n    if (s.rest && s.rest.running) {\n      const left = s.rest.left - dt;\n      if (left <= 0) { p.rest = { ...s.rest, left: 0, running: false, done: true }; this.buzz('Descanso concluído'); }\n      else p.rest = { ...s.rest, left, done: false };\n      any = true;\n    }\n    if (s.qr && s.qr.phase === 'running') {\n      const left = (s.qr.endAt - now) / 1000;\n      if (left <= 0) { p.qr = { ...s.qr, left: 0, phase: 'done' }; this.qrAlarm(); }\n      else p.qr = { ...s.qr, left };\n      any = true;\n    }\n    if (s.session && !s.paused) { p.tick = now; any = true; }\n    if (any) this.setState(p);\n  }\n\n  buzz(msg) { try { if (navigator.vibrate) navigator.vibrate(120); } catch (e) {} this.nudge(); this.showToast(msg, 'nudge'); }\n  reducedMotion() { try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; } }\n  // \"chamar a atenção\": a janela do descanso treme quando o tempo acaba\n  nudge() {\n    if (this.reducedMotion()) return;\n    this.setState({ nudge: true });\n    if (this._nt) clearTimeout(this._nt);\n    this._nt = setTimeout(() => this.setState({ nudge: false }), 700);\n  }\n  fxPR(key) {\n    if (this.reducedMotion()) return;\n    this.setState({ prFx: key });\n    if (this._pt) clearT ilateral', 3, 12, 0, 45], ['Prancha', 3, 40, 0, 45]\n      ])\n    ];\n  }\n\n  history(name) {\n    const out = [];\n    (this.state.db.sessions || []).forEach(s => {\n      (s.ex || []).forEach(e => {\n        if (e.name !== name) return;\n        const done = (e.sets || []).filter(x => x.done);\n        if (done.length) out.push({ date: s.date, sets: done, note: e.note || '' });\n      });\n    });\n    out.sort((a, b) => new Date(a.date) - new Date(b.date));\n    return out;\n  }\n  topLoad(sets) { return sets.reduce((m, s) => Math.max(m, Number(s.load) || 0), 0); }\n  volOf(sets) { return sets.reduce((v, s) => v + (Number(s.load) || 0) * (Number(s.reps) || 0), 0); }\n\n  exNames() {\n    const set = {};\n    (this.state.db.sessions || []).forEach(s => (s.ex || []).forEach(e => { if ((e.sets || []).some(x => x.done)) set[e.name] = 1; }));\n    return Object.keys(set);\n  }\n\n  startWorkout(w) {\n    if (!w) { this.showToast('Crie uma ficha primeiro'); this.setState({ tab: 'workouts', screen: 'app' }); return; }\n    const session = {\n      workoutId: w.id, name: w.name, startedAt: Date.now(), elapsed: 0,\n      ex: w.exercises.map(e => {\n        const h = this.history(e.name);\n        const lastTop = h.length ? this.topLoad(h[h.length - 1].sets) : null;\n        const load = lastTop != null && lastTop > 0 ? lastTop : Number(e.load) || 0;\n        return {\n          name: e.name, rest: e.rest || 60, target: { sets: e.sets, reps: e.reps }, note: '',\n          sets: Array.from({ length: e.sets }, () => ({ load, reps: w.gym ? (Number(e.reps) || 0) : (Number(e.reps) || 10), done: false }))\n        };\n      })\n    };\n    this.setState({ session, exIdx: 0, paused: false, screen: 'session', wid: w.id, rest: null, restOpen: false });\n  }\n\n  // Encerrar pede confirmação quando ainda há séries sem marcar (evita encerrar a ficha achando que é só o exercício)\n  requestFinish() {\n    const s = this.state.session; if (!s) return;\n    const total = s.ex.reduce((n, e) => n + e.sets.length, 0);\n    const done = s.ex.reduce((n, e) => n + e.sets.filter(x => x.done).length, 0);\n    if (total > 0 && done === total) { this.finish(); return; }\n    this.setState({ ask: { kind: done ? 'finish' : 'discard', done, total } });\n  }\n  discardSession() {\n    this.setState({ session: null, screen: 'app', tab: 'home', ask: null, rest: null, restOpen: false, paused: false });\n    this.showToast('Treino descartado');\n  }\n  undoFinish() {\n    const u = this.state.undo; if (!u) return;\n    const db = this.state.db;\n    this.save({ ...db, sessions: (db.sessions || []).filter(x => x.id !== u.id) });\n    this.setState({ session: u.session, screen: 'session', paused: false, done: null, prs: [], undo: null });\n  }\n  deleteSession(id, idx) {\n    const db = this.state.db, all = db.sessions || [];\n    const i = id ? all.findIndex(x => x.id === id) : idx;\n    if (i < 0 || i >= all.length) { this.setState({ ask: null }); return; }\n    this.save({ ...db, sessions: all.filter((x, k) => k !== i) });\n    this.setState({ ask: null });\n    this.showToast('Treino apagado');\n  }\n  finish() {\n    const s = this.state.session; if (!s) return;\n    const dur = Math.round((Date.now() - s.startedAt) / 1000);\n    const prs = [];\n    s.ex.forEach(e => {\n      const done = e.sets.filter(x => x.done); if (!done.length) return;\n      const prev = this.history(e.name);\n      const prevBest = prev.reduce((m, h) => Math.max(m, this.topLoad(h.sets)), 0);\n      const now = this.topLoad(done);\n      if (now > prevBest && now > 0) prs.push({ name: e.name, value: now + ' ' + this.unit() });\n    });\n    const setsDone = s.ex.reduce((n, e) => n + e.sets.filter(x => x.done).length, 0);\n    const volume = s.ex.reduce((v, e) => v + this.volOf(e.sets.filter(x => x.done)), 0);\n    const db = { ...this.state.db };\n    const recId = this.uid();\n    db.sessions = [...(db.sessions || []), { id: recId, workoutId: s.workoutId, name: s.name, date: new Date().toISOString(), duration: dur, ex: s.ex }];\n    this.save(db);\n    this.setState({\n      session: null, screen: 'done', prs, ask: null, undo: { id: recId, session: s },\n      done: { time: this.fmtLong(dur), sets: setsDone, volume: (volume >= 1000 ? (volume / 1000).toFixed(1) + 't' : volume + this.unit()), seed: Date.now() }\n    });\n    try { if (navigator.vibrate) navigator.vibrate([30, 70, 30, 70, 110]); } catch (e) {}\n  }\n\n  demoData() {\n    const ws = this.suggestions();\n    const sessions = []; const cardio = [];\n    const base = Date.now() - 27 * 86400000;\n    for (let wk = 0; wk < 4; wk++) {\n      ws.forEach((w, i) => {\n        const date = new Date(base + wk * 7 * 86400000 + i * 2 * 86400000).toISOString();\n        sessions.push({\n          id: this.uid(), workoutId: w.id, name: w.name, date, duration: 3300 + i * 180,\n          ex: w.exercises.map(e => {\n            const load = Math.round(((Number(e.load) || 0) + wk * (Number(e.load) > 40 ? 5 : 2)) * 10) / 10;\n            return { name: e.name, rest: e.rest, note: wk === 3 && i === 0 ? 'subi a carga, foi tranquilo' : '', sets: Array.from({ length: e.sets }, () => ({ load, reps: Number(e.reps) || 10, done: true })) };\n          })\n        });\n      });\n      for (let c = 0; c < 2; c++) {\n        const dist = 4.4 + wk * 0.25 + c * 0.3;\n        const dur = Math.round(dist * (390 - wk * 9));\n        cardio.push({ id: this.uid(), date: new Date(base + wk * 7 * 86400000 + (c * 3 + 1) * 86400000).toISOString(), duration: dur, distance: Math.round(dist * 100) / 100, incline: 3, kcal: Math.round(dist * 62) });\n      }\n    }\n    this.save({ ...this.state.db, onboarded: true, workouts: ws, sessions, cardio });\n    this.setState({ screen: 'app', tab: 'progress' });\n    this.showToast('4 semanas de exemplo carregadas');\n  }\n\n  parseImport(raw) {\n    const j = JSON.parse(raw.slice(raw.indexOf('{'), raw.lastIndexOf('}') + 1));\n    const ex = (j.exercises || []).map((e, i) => ({\n ndou bem, ' + v.firstName;\n    // decoração\n    v.decorOn = this.decorLevel() > 0;\n    v.navSparkHome = v.decorOn && st.tab === 'home'; v.navSparkWorkouts = v.decorOn && st.tab === 'workouts';\n    v.navSparkCardio = v.decorOn && st.tab === 'cardio'; v.navSparkProgress = v.decorOn && st.tab === 'progress';\n    const TAB_Z = [[72, 6, 94, 34], [80, 60, 96, 92]];\n    v.decoHome = null;\n    v.decoWorkouts = this.decorField('workouts', { sticker: { top: 40, right: 20 } });\n    v.decoCardio = this.decorField('cardio', { sticker: { top: 40, right: 20 } });\n    v.decoProgress = this.decorField('progress', { sticker: { top: 34, right: 20 } });\n    v.decoWeek = null;\n    v.decoCluster = this.decorCluster(st.screen);\n    if (st.screen === 'done') { const fx = this.doneFxEls(st.done && st.done.seed); v.doneFx = fx.layer; v.doneHeart = fx.heart; }\n    else { v.doneFx = null; v.doneHeart = null; }\n    v.closeDone = () => this.setState({ screen: 'app', tab: 'home', done: null, prs: [], undo: null });\n\n    // profile\n    v.profileName = db.profile.name;\n    v.profileSub = db.profile.goal + ' · ' + db.profile.freq + 'x por semana';\n    v.setProfileName = (e) => this.save({ ...db, profile: { ...db.profile, name: e.target.value } });\n    v.goals = ['Glúteos e pernas', 'Corpo inteiro', 'Força', 'Condicionamento'].map(g => ({\n      label: g, on: db.profile.goal === g, style: this.chip(db.profile.goal === g), set: () => this.save({ ...db, profile: { ...db.profile, goal: g } })\n    }));\n    v.units = ['kg', 'lb'].map(u => ({ label: u, on: db.profile.unit === u, style: this.chip(db.profile.unit === u), set: () => this.save({ ...db, profile: { ...db.profile, unit: u } }) }));\n    v.loadDemo = () => this.demoData();\n    v.resetAll = () => {\n      this.save({ v: 1, onboarded: true, profile: db.profile, workouts: [], sessions: [], cardio: [] });\n      this.setState({ screen: 'app', tab: 'home', session: null });\n      this.showToast('Dados apagados');\n    };\n\n
